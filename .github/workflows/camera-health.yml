name: Camera health status

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: camera-health-status
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check camera health
        env:
          CAMERA_PROXY_URL: https://camera-proxy.eplus.dev/camera
          CAMERA_PROXY_ORIGIN: https://eplus.dev
          CAMERA_HEALTH_CONCURRENCY: "12"
          CAMERA_HEALTH_TIMEOUT_MS: "6000"
          CAMERA_HEALTH_OFFLINE_AFTER: "2"
        run: node .github/scripts/check-camera-health.mjs

      - name: Publish status branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp status/camera-status.json "$tmp/camera-status.json"
          cd "$tmp"
          git init
          git checkout -b status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add camera-status.json
          git commit -m "chore: update camera health status"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin status
