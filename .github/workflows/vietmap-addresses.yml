name: Enrich VietMap addresses

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum cameras to process (0 = all missing)"
        required: false
        default: "0"
      force:
        description: "Re-enrich cameras that already have VietMap data"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 20 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Enrich camera addresses
        env:
          VIETMAP_API_KEY: ${{ secrets.VIETMAP_API_KEY }}
          INPUT_LIMIT: ${{ github.event.inputs.limit || '0' }}
          INPUT_FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          if [ -z "$VIETMAP_API_KEY" ]; then
            echo "::error::Missing repository secret VIETMAP_API_KEY"
            exit 1
          fi

          ARGS=(--limit="$INPUT_LIMIT")
          if [ "$INPUT_FORCE" = "true" ]; then
            ARGS+=(--force)
          fi

          php scripts/enrich-vietmap.php "${ARGS[@]}"

      - name: Validate enriched data
        run: |
          php -r '
            $data = json_decode(file_get_contents("data-camera.json"), true, 512, JSON_THROW_ON_ERROR);
            foreach ($data as $i => $camera) {
                if (!isset($camera["Address"]["legacy"]["province"]["name"])) {
                    fwrite(STDERR, "Camera {$i} has invalid legacy address structure.\n");
                    exit(1);
                }
            }
          '

      - name: Create update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data-camera.json; then
            echo "No address changes."
            exit 0
          fi

          BRANCH="automation/vietmap-addresses-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data-camera.json
          git commit -m "data: enrich camera addresses from VietMap"
          git push origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "data: enrich camera addresses from VietMap" \
            --body "Automated VietMap v4 enrichment. Stores structured legacy/current addresses and coordinates; UI filters by the legacy district only."
