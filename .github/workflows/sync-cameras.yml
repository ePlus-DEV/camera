name: Sync camera data

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force_geocode:
        description: Re-run VietMap reverse geocoding for every camera with coordinates
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: camera-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate sync script
        run: node --check scripts/sync-cameras.mjs

      - name: Sync source coordinates and VietMap addresses
        env:
          VIETMAP_API_KEY: ${{ secrets.VIETMAP_API_KEY }}
          HCM_TRAFFIC_COOKIE: ${{ secrets.HCM_TRAFFIC_COOKIE }}
        run: |
          args=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_geocode }}" == "true" ]]; then
            args+=(--force-geocode)
          fi
          node scripts/sync-cameras.mjs "${args[@]}"

      - name: Detect data changes
        id: changes
        run: |
          if git diff --quiet -- data-camera.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No camera data changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- data-camera.json
          fi

      - name: Create or update sync pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="data/auto-sync-cameras"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH" || true
          git checkout -B "$BRANCH"
          git add data-camera.json
          git commit -m "data: sync camera locations"
          git push --force-with-lease origin "HEAD:$BRANCH"

          existing_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --base develop --head "$BRANCH" --state open --json url --jq '.[0].url // ""')"
          if [[ -n "$existing_pr" ]]; then
            echo "Updated existing PR: $existing_pr"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base develop \
              --head "$BRANCH" \
              --title "data: sync traffic camera locations" \
              --body "Automated camera data sync from the HCMC traffic source. Adds new published cameras, refreshes source coordinates, and fills missing address fields through VietMap when VIETMAP_API_KEY is configured. Existing source-missing cameras are retained for manual review."
          fi
